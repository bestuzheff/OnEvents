description: |
<p>EDT — это не просто «другая среда разработки». Если правильно настроить рабочий процесс, она позволяет быстрее ориентироваться в коде, раньше находить ошибки и удобнее работать с Git. </p>
<br>
<p>На вебинаре вместе с Александром Митрофановым начнём с нуля и в высоком темпе пройдём путь от создания рабочей области до повседневной работы с кодом и Git. Минимум теории — максимум того, что можно сразу попробовать и забрать в работу.</p>
<p>Что разберём на практике:</p>
<p>— Развернём рабочую область: создадим ИБ, проект и репозиторий.</p>
<p>— Разберёмся, чем Git похож на привычное хранилище 1С и какие дополнительные возможности он даёт.</p>
<p>— Настроим навигацию по коду и посмотрим на самые полезные панели EDT.</p>
<p>— Попробуем синтаксические подсказки и проверки «на лету».</p>
<p>— Выполним базовые операции с Git: commit, cherry-pick, reset и другие.</p>
<br>
<p>Для кого?</p>
<br>
<p>Для разработчиков 1С, которые:</p>
<p>— ещё ни разу не запускали EDT;</p>
<p>— пробовали EDT, но не смогли привыкнуть;</p>
<p>— уже работают в EDT, но используют только небольшую часть его возможностей.</p>
<br>
<p>После вебинара вы сможете:</p>
<p>— самостоятельно развернуть рабочую область;</p>
<p>— настроить EDT под свой рабочий процесс;</p>
<p>— быстрее находить нужный код и перемещаться по проекту;</p>
<p>— находить многие ошибки ещё до запуска приложения;</p>
<p>— увереннее выполнять базовые операции с Git;</p>
<p>— и, возможно, наконец полюбить EDT.</p> # Краткое описание
