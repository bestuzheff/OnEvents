description: |
  <p>Гость стрима — Стас Назаров, разработчик EnterpriseData и архитектор «Конвертации данных 3.1». Сейчас Стас работает Solution Architect проекта 1С в крупнейшей компании-налогоплательщике Армении — Зангезурском медно-молибденовом комбинате.</p>
  <br>
  <p>Поговорим о том, как устроена работа 1С-архитектора за пределами России:</p>
  <p>— как Стас пришёл в международный проект;</p>
  <p>— чем работа с 1С в Армении отличается от работы в России;</p>
  <p>— какие задачи решает Solution Architect на крупном промышленном предприятии;</p>
  <p>— как устроены команда, процессы и взаимодействие с заказчиком;</p>
  <p>— с какими техническими и организационными сложностями приходится сталкиваться;</p>
  <p>— востребованы ли специалисты по 1С за рубежом и как найти такую работу;</p>
  <p>— какие знания и опыт нужны для выхода за пределы российского рынка.</p>
  <br>
  <p>Обсудим реальный опыт работы над большим проектом: без общих рассуждений — о технологиях, архитектуре, людях и жизни 1С-специалиста в другой стране.</p>
  <br>
  <p>📅 15 сент. 2026 в 20:00 МСК</p>
