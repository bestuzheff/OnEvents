title: "Автоматизация или имитация: почему бизнес-системы всё ещё требуют столько ручной работы?"
date: "2026-12-02"
pic: "2026-12-02_M1C.jpg"
description: |
  <p>На встрече клуба «Мир 1С» поговорим о том, куда движутся бизнес-приложения. Мы много сил тратим на ручной ввод данных, выстраивание процессов и фиксацию контрольных действий. Но всегда ли это действительно автоматизация?</p>
  <p>Наш гость — Роман Царенко, соучредитель компании «Симфония Про». Он больше 14 лет работает в сфере 1С: был аналитиком, руководителем проектов и отдела, работал в том числе с задачами банковской сферы.</p>
  <p>Вместе обсудим, как ИИ, process mining и новые способы сбора данных могут уменьшить ручную работу. Какие подходы уже полезны на практике, а какие пока только добавляют ещё один слой к привычным процессам? И во что стоит вкладываться сегодня, чтобы оставаться востребованными через два-три года?</p>
  <p>Формат — открытый разговор. Приходите со своими примерами и вопросами: интересно сравнить, что действительно работает в разных компаниях.</p>
  <p>После встречи запись будет размещена в закрытой группе.</p>
